<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP Classroom Toolkit</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <h1>AP Classroom Toolkit</h1>
    <div class="settings">
        <h2>Settings</h2>
        <div class="setting">
            <label for="arrow-navigation">Arrow Key Navigation</label>
            <input type="checkbox" id="arrow-navigation" checked>
        </div>
        <div class="setting">
            <label for="number-selection">Number Key Selection</label>
            <input type="checkbox" id="number-selection" checked>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
