<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AP Classroom Toolkit</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>AP Classroom Toolkit</h1>
    </header>

    <section class="module-section">
      <div class="module-header">
        <label class="toggle">
          <input type="checkbox" id="arrowNavEnabled" checked>
          <span class="toggle-slider"></span>
        </label>
        <h2>Arrow Navigation</h2>
      </div>
      <p class="module-desc">Use arrow keys to navigate between questions</p>
      <div class="key-settings">
        <div class="key-input-group">
          <label>Previous Question:</label>
          <input type="text" id="leftKey" value="ArrowLeft" readonly class="key-input" data-key="leftKey">
        </div>
        <div class="key-input-group">
          <label>Next Question:</label>
          <input type="text" id="rightKey" value="ArrowRight" readonly class="key-input" data-key="rightKey">
        </div>
      </div>
    </section>

    <section class="module-section">
      <div class="module-header">
        <label class="toggle">
          <input type="checkbox" id="numberSelEnabled" checked>
          <span class="toggle-slider"></span>
        </label>
        <h2>Number Selection</h2>
      </div>
      <p class="module-desc">Press 1-5 to select options quickly</p>
      <div class="key-settings">
        <div class="key-input-group">
          <label>Selection Keys:</label>
          <input type="text" id="selectionKeys" value="1, 2, 3, 4, 5" class="key-input">
        </div>
      </div>
    </section>

    <footer>
      <button id="saveBtn" class="save-btn">Save Settings</button>
      <span id="saveStatus" class="save-status"></span>
    </footer>
  </div>
  <script src="shared/features.js"></script>
  <script src="popup.js"></script>
</body>
</html>
